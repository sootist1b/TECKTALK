# Render Blueprint: 저장소를 Render에 연결하면 이 설정대로 웹 서비스 1개가 만들어진다.
services:
  - type: web
    name: techtalk-memscm
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_USER
        value: demo
      - key: DEMO_PASSWORD
        value: demo
      - key: TZ_OFFSET_HOURS
        value: "9"
