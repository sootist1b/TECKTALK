name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (React build + FastAPI)
        run: docker build -t memscm .

      - name: Run container
        run: docker run -d -p 8000:8000 --name memscm memscm

      - name: Smoke test API and SPA
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
          curl -sf http://localhost:8000/api/state \
            | python3 -c 'import sys,json;s=json.load(sys.stdin)["state"];assert len(s["projects"])==3;print("projects ok")'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/auth/login -X POST)" != "200"

      - name: Container logs
        if: always()
        run: docker logs memscm
